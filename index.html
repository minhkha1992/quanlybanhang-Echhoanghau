Act.saveCloudQuick = async () => {
  const uEl = document.getElementById('cpUrl');
  const sEl = document.getElementById('cpSecret');
  const aEl = document.getElementById('cpAuto');
  const raw = uEl ? uEl.value.trim() : '';
  const url = CloudSync.normalizeUrl(raw);
  CloudSync.saveCfg({ url, secret: sEl ? sEl.value.trim() : '', autoSync: aEl ? aEl.checked : true });
  CloudSync.startLoop();
  if (!url) { CloudSync.setStatus('off', 'Chưa kết nối'); toast('Đã tắt đường dẫn đồng bộ Vercel.'); refreshView(); return; }
  toast('Đã lưu đường dẫn Vercel — đang kiểm tra kết nối...');
  const ok = await CloudSync.pullNow(false, false);
  if (ok) refreshView();
};
Act.cloudPushNow = () => CloudSync.pushNow(false);
Act.cloudPullNow = () => CloudSync.pullNow(false, true);

const VERCEL_API_SAMPLE = `// File: api/sync.js (Đặt trong thư mục api/ khi đưa lên Vercel)
let memoryStore = null;
export default async function handler(req, res) {
  res.setHeader('Access-Control-Allow-Origin', '*');
  res.setHeader('Access-Control-Allow-Methods', 'GET, POST, OPTIONS');
  res.setHeader('Access-Control-Allow-Headers', 'Content-Type, x-sync-secret');
  if (req.method === 'OPTIONS') return res.status(200).end();
  const secret = process.env.SYNC_SECRET || '';
  if (secret && req.headers['x-sync-secret'] !== secret) {
    return res.status(401).json({ ok: false, error: 'Sai mã bảo mật (SYNC_SECRET)' });
  }
  if (req.method === 'GET') {
    return res.status(200).json({ ok: true, data: memoryStore });
  }
  if (req.method === 'POST') {
    memoryStore = req.body;
    return res.status(200).json({ ok: true, updatedAt: Date.now() });
  }
  return res.status(405).json({ ok: false });
}`;

Act.cloudModal = () => {
  const c = CloudSync.cfg();
  const baseAppUrl = c.url ? c.url.replace(/\/api\/sync\/?$/i, '') : (location.protocol.startsWith('http') ? location.origin : 'https://ten-du-an.vercel.app');
  const magicLink = c.url ? `${baseAppUrl}/?cloud_url=${encodeURIComponent(c.url)}${c.secret ? '&cloud_key=' + encodeURIComponent(c.secret) : ''}` : '';
  const qrFallback = vietQRSvgFallback('VERCEL', c.url || 'EHH', 0, magicLink || 'https://vercel.com');
  const body = `<div class="form-grid">
    <div class="field wide">
      <label for="cmUrl">1. Đường dẫn (Link) đồng bộ Vercel của bạn</label>
      <input id="cmUrl" class="input lg" value="${esc(c.url)}" placeholder="Ví dụ: https://ech-hoang-hau.vercel.app hoặc https://.../api/sync" autocomplete="off">
      <span class="hint">Bạn chỉ cần dán tên miền <b>https://....vercel.app</b>, hệ thống sẽ tự động gắn đuôi <code>/api/sync</code>.</span>
    </div>
    <div class="field">
      <label for="cmSecret">2. Mã bảo mật (Secret Key)</label>
      <input id="cmSecret" class="input" type="password" value="${esc(c.secret)}" placeholder="Không bắt buộc" autocomplete="off">
    </div>
    <div class="field">
      <label for="cmSec">3. Chu kỳ tự động đồng bộ (giây)</label>
      <input id="cmSec" class="input num" type="number" min="10" max="300" value="${c.intervalSec || 25}">
    </div>
    <div class="field wide">
      <label class="chk"><input type="checkbox" id="cmAuto" ${c.autoSync ? 'checked' : ''}><b>Tự động đồng bộ 2 chiều</b> (Khi nhập đơn trên điện thoại hoặc máy tính, dữ liệu tự đẩy lên Vercel sau 1 giây; nếu mất mạng sẽ tự lưu hàng đợi và gửi bù ngay khi có mạng).</label>
    </div>
  </div>
  <div class="actions mt" style="padding:10px 12px;background:var(--subtle);border-radius:10px;justify-content:space-between">
    <div><b>Trạng thái:</b> <span id="cmStatusTxt">${esc(CloudSync.msg)}</span>${c.lastSync ? ` · Lần cuối: <b>${esc(c.lastSync)}</b>` : ''}${c.pendingSync ? ' · <span class="debt">Có dữ liệu chờ đẩy lên</span>' : ''}</div>
    <div class="actions">
      <button class="btn sm" type="button" id="cmPull">${icon('download')}Tải từ Vercel về máy</button>
      <button class="btn sm primary" type="button" id="cmPush">${icon('upload')}Đẩy dữ liệu máy này lên Vercel</button>
    </div>
  </div>
  ${magicLink ? `<div class="qr-wrap mt" style="background:var(--subtle);border-color:var(--line)">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(magicLink)}" alt="QR kết nối điện thoại" onerror="this.onerror=null;this.src='${qrFallback}'">
    <div style="flex:1">
      <b>📱 Mở nhanh trên Điện thoại (không cần gõ lại Link)</b>
      <p class="hint" style="margin:4px 0 8px">Quét mã QR bên cạnh bằng camera điện thoại/Zalo hoặc sao chép đường dẫn dưới đây gửi qua Zalo để điện thoại tự động nạp sẵn Link Vercel:</p>
      <div class="row-gap"><input class="input" id="cmMagic" readonly value="${esc(magicLink)}" style="font-size:12.5px"><button class="btn sm" type="button" id="cmCopyMagic">Copy Link</button></div>
    </div>
  </div>` : ''}
  <details class="mt">
    <summary style="cursor:pointer;font-weight:600;color:var(--brand)">Xem mã nguồn mẫu file <code>api/sync.js</code> (đã có sẵn trong Bộ Cài Đặt .zip)</summary>
    <pre style="margin-top:8px;padding:10px;background:var(--subtle);border:1px solid var(--line);border-radius:8px;font-size:12px;overflow-x:auto">${esc(VERCEL_API_SAMPLE)}</pre>
    <button class="btn sm mt" type="button" id="cmCopyApi">Sao chép mã api/sync.js</button>

  const m = UI.modal({

  });
  const saveForm = () => {
    const url = CloudSync.normalizeUrl($('#cmUrl', m.el).value);

  $('#cmSave', m.el).onclick = async () => {

  const cpM = $('#cmCopyMagic', m.el);
  if (cpM) cpM.onclick = async () => { try { await navigator.clipboard.writeText(magicLink); } catch (e) { $('#cmMagic', m.el).select(); document.execCommand('copy'); } toast('Đã sao chép Link mở nhanh cho điện thoại!'); };
  const cpA = $('#cmCopyApi', m.el);

};

function boot() {
  ['favicon', 'loginLogo', 'brandLogo'].forEach(id => { const e = document.getElementById(id); if (e) e[id === 'favicon' ? 'href' : 'src'] = ASSETS.logo; });
  let firstRun = false; try { firstRun = !localStorage.getItem(KEYS.wholesale); } catch (e) { firstRun = false; }
  S.firstRun = firstRun && BUILD === 'web';
  try { Store.load(); } catch (e) { console.error(e); document.body.innerHTML = `<div class="empty"><h2>Không đọc được dữ liệu</h2><p>${esc(e.message)}</p></div>`; return; }
  applyDensity(); applyAppearance();
  S.day = pickInitialDay(); S.rDate = todayISO(); if (ensureRetailDay(S.rDate)) Store.saveR(true);
  const today = new Date().toLocaleDateString('vi-VN'); const snaps = getSnapshots(); if (!firstRun && (!snaps.length || !String(snaps[0].time || '').includes(today))) snapshot(`Tự động đầu ngày ${today}`);
  bindEvents(); bindLogin();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { /* không bắt buộc */ });
  if (BUILD === 'web' && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { /* chạy được khi không có */ });
  CloudSync.init();
  if (Auth.restore()) showApp(); else showLogin();
}
document.addEventListener('DOMContentLoaded', boot);
window.HH = { Store, Auth, S, CloudSync, computeWholesale, retailDayStats, code128Widths, numberToWords, version: APP_VERSION };
