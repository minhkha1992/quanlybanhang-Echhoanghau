<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ếch Hoàng Hậu — Quản trị đơn hàng, kho &amp; hóa đơn</title>
<link id="favicon" rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Ếch Hoàng Hậu — giao diện bản 3. Màu, cỡ chữ, khoảng cách đều lấy từ biến
   bên dưới; đổi màu thương hiệu chỉ cần sửa ở :root.
   ========================================================================== */
:root{
  color-scheme: light;
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#F5F8F5; --surface-3:#E8EEE9;
  --ink:#15231C; --ink-2:#3A4C42; --muted:#64746A;
  --line:#D9E2DA; --line-strong:#B4C3B8;
  --brand:#1D6A4D; --brand-hover:#16573F; --brand-ink:#FFFFFF; --brand-soft:#E0EFE6; --row-on:#F0F7F2;
  --gold:#A87412; --gold-soft:#FBF0D6;
  --debt:#B0352B; --debt-soft:#FBE8E5;
  --paid:#1E7443; --paid-soft:#E2F2E7;
  --warn:#8A5A00; --warn-soft:#FFF2D1;
  --ring:rgba(29,106,77,.30);
  --p-et:#1D6A4D; --p-en:#2B8A8A; --p-l:#B7791F; --p-c:#7A4E8C; --p-k:#6B7A70;
  --c-rev:#1D6A4D; --c-paid:#7DB892; --c-cost:#B7791F;
  --shadow-pop:0 18px 48px rgba(16,30,22,.20),0 2px 6px rgba(16,30,22,.08);
  --r-s:8px; --r-m:12px; --r-l:16px;
  --ctl:44px; --cell:40px;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0E1512; --surface:#151F1A; --surface-2:#1A2620; --surface-3:#22302A;
    --ink:#E4ECE6; --ink-2:#C2CFC6; --muted:#8FA096;
    --line:#27362E; --line-strong:#3D5145;
    --brand:#46A97F; --brand-hover:#58BC91; --brand-ink:#06120C; --brand-soft:#173329; --row-on:#17271E;
    --gold:#E2B24D; --gold-soft:#372C12;
    --debt:#F08C80; --debt-soft:#3A1E1A;
    --paid:#6FD49B; --paid-soft:#163223;
    --warn:#F3C35E; --warn-soft:#382D12;
    --ring:rgba(70,169,127,.38);
    --p-et:#46A97F; --p-en:#4CB7B7; --p-l:#E0A84A; --p-c:#B98BCB; --p-k:#93A398;
    --c-rev:#46A97F; --c-paid:#2F6B4C; --c-cost:#E0A84A;
    --shadow-pop:0 18px 48px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{line-height:1.25}
a{color:var(--brand)}
.ic{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
.debt{color:var(--debt)} .paid{color:var(--paid)} .warn{color:var(--warn)} .brand-c{color:var(--brand)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.grow{flex:1}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--ring)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Khung ứng dụng ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:12px;padding:16px 16px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.brand img{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--gold);object-fit:contain;flex:none}
.brand b{display:block;font-size:16.5px;letter-spacing:-.01em}
.brand span{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.nav{padding:8px 10px 16px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav .grp{font-size:12.5px;font-weight:600;color:var(--muted);padding:16px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500;transition:background .12s,color .12s}
.nav a:hover{background:var(--surface-3);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700;box-shadow:inset 3px 0 0 var(--brand)}
.side-foot{padding:12px 16px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar .ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex:1;min-width:0}
.topbar .right{display:flex;align-items:center;gap:8px;margin-left:auto}
.menu-btn{display:none!important}
.page{padding:22px 24px 56px;width:100%;max-width:1720px}
.scrim-nav{display:none}
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:288px;transform:translateX(-104%);transition:transform .2s ease;box-shadow:var(--shadow-pop)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim-nav{display:block;position:fixed;inset:0;background:rgba(10,18,14,.42);z-index:35}
  .menu-btn{display:inline-flex!important}
  .topbar{padding:8px 12px;min-height:64px;flex-wrap:wrap}
  .page{padding:16px 12px 48px}
  .userchip span{display:none}
}

/* ---------- Nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--ctl);padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1.2;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,color .12s,box-shadow .12s}
.btn:hover{border-color:var(--ink-2);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-hover);border-color:var(--brand-hover);box-shadow:0 4px 14px rgba(29,106,77,.28)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-3);border-color:transparent}
.btn.danger{color:var(--debt)}
.btn.danger:hover{background:var(--debt-soft);border-color:var(--debt)}
.btn.danger-solid{background:var(--debt);border-color:var(--debt);color:#fff}
.btn.danger-solid:hover{filter:brightness(1.07)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:7px}
.btn.lg{min-height:52px;font-size:16.5px;padding:0 22px}
.btn.icon{width:var(--ctl);padding:0}
.btn.icon.sm{width:36px}
.btn.block{width:100%}
.btn .ic{width:19px;height:19px}

/* ---------- Ô nhập ---------- */
.input,.select,.textarea{width:100%;min-height:var(--ctl);border:1px solid var(--line-strong);border-radius:var(--r-s);background:var(--surface);padding:0 12px;font-size:15px;color:var(--ink);transition:border-color .12s,box-shadow .12s}
.select{padding-right:8px;cursor:pointer}
.textarea{padding:10px 12px;min-height:76px;resize:vertical}
.input:hover,.select:hover,.textarea:hover{border-color:var(--muted)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
.input.lg{min-height:52px;font-size:18px;font-weight:600}
.input.num{text-align:right;font-variant-numeric:tabular-nums}
.input::placeholder{color:var(--muted);opacity:.75}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.field.inline{flex-direction:row;align-items:center;gap:10px}
.field.inline .select{width:auto;min-width:200px}
.hint{font-size:13px;color:var(--muted)}
.chk{display:inline-flex;align-items:center;gap:10px;cursor:pointer;min-height:40px;font-weight:500;user-select:none}
.chk input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 16px}
.form-grid .wide{grid-column:1/-1}
.row-gap{display:flex;gap:8px;align-items:center}
.row-gap>.input{flex:1}
.mt{margin-top:14px}

/* ---------- Đầu trang, thanh công cụ ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:16px}
.page-head h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.page-head .sub{margin-top:3px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:16px 0 10px}
.search{position:relative;flex:1 1 260px;max-width:440px;display:block}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .input{padding-left:40px}
.below{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.below .hint{margin-left:auto}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--surface-3);border-radius:11px}
.seg button{min-height:38px;padding:0 13px;border:0;background:transparent;border-radius:8px;font-weight:600;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .12s,color .12s}
.seg button:hover{background:var(--surface);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.seg .count{font-size:12px;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--line);color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:center}
.seg button[aria-pressed="true"] .count{background:var(--brand-soft);color:var(--brand)}
.seg.sm button{min-height:32px;padding:0 10px;font-size:13.5px}

/* ---------- Thanh chọn ngày (điểm nhấn) ---------- */
.daynav{display:flex;align-items:stretch;height:56px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);overflow:hidden;flex:none}
.daynav .arrow{width:48px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);transition:background .12s}
.daynav .arrow:hover:not(:disabled){background:var(--surface-3);color:var(--ink)}
.daynav .arrow:disabled{opacity:.3;cursor:default}
.daynav .arrow .ic{width:22px;height:22px}
.daynav .day{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:176px;padding:0 18px;border-left:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer}
.daynav .day:hover{background:var(--surface-2)}
.daynav .big{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--ink)}
.daynav .small{font-size:12.5px;color:var(--muted);line-height:1.25;margin-top:2px;white-space:nowrap}
.daynav select,.daynav input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;font-size:16px}
.savechip,.userchip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.savechip:hover,.userchip:hover{border-color:var(--line-strong);background:var(--surface-2)}
.savechip i{width:8px;height:8px;border-radius:50%;background:var(--paid)}
.userchip .av{width:28px;height:28px;margin-left:-6px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:12px}

/* ---------- Dải số liệu tóm tắt ---------- */
.stats{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.stat{flex:1 1 230px;padding:13px 18px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .k{font-size:13px;color:var(--muted);font-weight:500}
.stat .v{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.stat .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.is-debt .v{color:var(--debt)} .stat.is-paid .v{color:var(--paid)} .stat.is-brand .v{color:var(--brand)}
@media (max-width:700px){.stat{flex-basis:50%;border-bottom:1px solid var(--line)}.stat .v{font-size:19px}}

/* ---------- Bảng ---------- */
.tbl-wrap{position:relative;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);max-height:calc(100vh - 290px);min-height:220px}
.tbl-wrap.free{max-height:none;min-height:0}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:15px}
.grid th{position:sticky;top:0;z-index:3;background:var(--surface-2);color:var(--ink-2);font-size:13px;font-weight:600;text-align:right;padding:0 10px;height:38px;border-bottom:1px solid var(--line);white-space:nowrap}
.grid thead tr.r2 th{top:38px;height:30px;font-weight:500;color:var(--muted);font-size:12.5px}
.grid th.l,.grid td.l{text-align:left}
.grid th.c,.grid td.c{text-align:center}
.grid td{background:var(--surface);border-bottom:1px solid var(--line);padding:6px 10px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.grid tbody tr:hover td{background:var(--surface-2)}
.grid tr.on td{background:var(--row-on)}
.grid tr.on:hover td{background:var(--brand-soft)}
.grid tr.click{cursor:pointer}
.grid .s0{position:sticky;left:0;z-index:2;width:58px;min-width:58px;max-width:58px}
.grid .s1{position:sticky;left:58px;z-index:2;min-width:210px;box-shadow:inset -1px 0 0 var(--line)}
.grid th.s0,.grid th.s1{z-index:4}
.grid tfoot td{position:sticky;bottom:0;z-index:2;background:var(--surface-3);font-weight:700;border-top:1px solid var(--line-strong);border-bottom:0}
.grid tfoot td.s0,.grid tfoot td.s1{z-index:3}
.grid.static tfoot td{position:static}
.grid td.ed{padding:3px 4px}
.grid .ci{width:100%;min-width:76px;height:var(--cell);border:1px solid transparent;border-bottom-color:var(--line-strong);border-radius:6px 6px 2px 2px;background:transparent;padding:0 9px;text-align:right;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink)}
.grid .ci.money{min-width:100px}
.grid .ci.t{text-align:left;min-width:130px}
.grid tr:hover .ci{border-color:var(--line-strong);background:var(--surface)}
.grid .ci:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px var(--ring);outline:none;border-radius:6px}
.grid .ci::placeholder{color:var(--line-strong)}
.grid td.calc{font-weight:600}
.grid td.big{font-weight:800}
.grid .neg{color:var(--paid)} .grid .pos-debt{color:var(--debt)} .grid .zero{color:var(--muted);font-weight:400}
.grid .grp-h{text-align:center;border-left:1px solid var(--line)}
.grid .bl{border-left:1px solid var(--line)}
.grid .empty-row{padding:28px 16px;color:var(--muted);text-align:left;white-space:normal}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px;flex:none}
.dot.p-et{background:var(--p-et)} .dot.p-en{background:var(--p-en)} .dot.p-l{background:var(--p-l)} .dot.p-c{background:var(--p-c)} .dot.p-k{background:var(--p-k)}
.namebtn{display:block;border:0;background:none;padding:3px 2px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.namebtn:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.namebtn.empty{color:var(--muted);font-weight:500;font-style:italic}
.subtxt{display:block;font-size:12.5px;color:var(--muted);font-weight:400;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paycell{display:flex;align-items:center;gap:4px}
.mini{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--paid);background:var(--paid-soft);color:var(--paid);font-weight:700;font-size:13px;cursor:pointer;flex:none}
.mini:hover{background:var(--paid);color:#fff}
.rowact{display:flex;gap:2px;justify-content:flex-end}
.ov-mark{border-bottom:2px dotted var(--gold)!important;color:var(--gold)!important}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--paid-soft);color:var(--paid)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--debt-soft);color:var(--debt)}
button.tag{border:0;cursor:pointer}
body.density-compact{--cell:32px} body.density-normal{--cell:36px} body.density-comfortable{--cell:40px}

/* ---------- Khối nội dung ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:13px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:16.5px;font-weight:700}
.panel-body{padding:16px 18px}
.panel+.panel,.stack>*+*{margin-top:16px}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.cols2>.panel+.panel{margin-top:0}
.cols-7-5{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
.cols-7-5>.panel+.panel{margin-top:0}
@media (max-width:1100px){.cols2,.cols-7-5{grid-template-columns:1fr}.cols2>.panel+.panel,.cols-7-5>.panel+.panel{margin-top:16px}}
.kv{display:flex;flex-direction:column}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.kv>div:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums;white-space:nowrap}
.kv .total{border-top:2px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:12px;font-size:17px}
.act-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.act-row:first-child{padding-top:0}
.act-row:last-child{border-bottom:0;padding-bottom:0}
.act-row p{margin-top:2px}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:19px;margin-bottom:6px}
.empty .actions{justify-content:center;margin-top:16px}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-m);border:1px solid transparent;margin-bottom:16px}
.banner.warn{background:var(--warn-soft);border-color:rgba(168,116,18,.35);color:var(--warn)}
.banner .grow{min-width:220px}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:16px}
.quick button{display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:border-color .12s,background .12s}
.quick button:hover{border-color:var(--brand);background:var(--brand-soft)}
.quick .qi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.quick b{display:block;font-size:15.5px} .quick span{display:block;font-size:13px;color:var(--muted)}
.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden;margin-top:16px}
.insights>div{padding:12px 16px;border-right:1px solid var(--line)}
.insights>div:last-child{border-right:0}
.insights .k{font-size:13px;color:var(--muted)} .insights b{display:block;font-size:16px;margin-top:2px}
.bar-pct{display:inline-block;height:6px;border-radius:3px;background:var(--brand);vertical-align:middle;margin-right:8px;opacity:.75}

/* ---------- Công nợ: danh sách + chi tiết ---------- */
.split{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.plist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;position:sticky;top:88px}
.plist-head{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.plist-head .search{max-width:none}
.plist-items{max-height:calc(100vh - 250px);overflow:auto}
.pitem{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px;text-align:left;cursor:pointer;color:var(--ink)}
.pitem:hover{background:var(--surface-2)}
.pitem[aria-current="true"]{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
.pitem b{font-weight:600;display:block}
.pitem .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pdetail-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.pdetail-head h2{font-size:22px;font-weight:800;letter-spacing:-.015em}
@media (max-width:1000px){.split{grid-template-columns:1fr}.plist{position:static}.plist-items{max-height:300px}}

/* ---------- Biểu đồ ---------- */
.chart{min-width:0}
.chart .legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--ink-2);margin-bottom:8px}
.chart .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-scroll{overflow-x:auto}
.chart svg{display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11.5px;font-family:var(--font)}

/* ---------- Lớp phủ: hộp thoại, ngăn kéo, menu, thông báo ---------- */
.ov{position:fixed;inset:0;z-index:70}
.scrim{position:absolute;inset:0;background:rgba(10,18,14,.45);animation:fade .15s ease-out}
.modal{position:absolute;left:50%;top:6vh;transform:translateX(-50%);width:min(560px,calc(100vw - 24px));max-height:88vh;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow-pop);animation:pop .16s ease-out}
.modal.sm{width:min(440px,calc(100vw - 24px))}
.modal.lg{width:min(1000px,calc(100vw - 24px))}
.modal-head,.drawer-head{display:flex;align-items:center;gap:12px;padding:14px 14px 14px 20px;border-bottom:1px solid var(--line)}
.modal-head h2,.drawer-head h2{font-size:18px;font-weight:700;flex:1}
.modal-body{padding:18px 20px;overflow:auto}
.modal-foot,.drawer-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-l) var(--r-l)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-pop);animation:slide .2s ease-out}
.drawer-body{flex:1;overflow:auto;padding:18px 20px}
.drawer-foot{border-radius:0}
.confirm-msg{font-size:15.5px;line-height:1.55}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.menu{position:fixed;z-index:90;min-width:240px;max-width:330px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);padding:6px;animation:fade .1s}
.menu button{display:flex;width:100%;align-items:center;gap:11px;min-height:42px;padding:0 12px;border:0;background:none;border-radius:8px;color:var(--ink);text-align:left;cursor:pointer;font-weight:500}
.menu button:hover:not(:disabled),.menu button:focus-visible{background:var(--surface-3);box-shadow:none}
.menu button:disabled{opacity:.4;cursor:not-allowed}
.menu button.danger{color:var(--debt)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .mhead{padding:8px 12px 6px;font-size:13px;color:var(--muted)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:16px;background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow-pop);font-weight:500;max-width:min(600px,calc(100vw - 24px));animation:pop2 .18s ease-out}
.toast.err{background:var(--debt);color:#fff}
.toast button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:4px;white-space:nowrap}
.toast.out{opacity:0;transition:opacity .25s}
@keyframes pop2{from{opacity:0;transform:translateY(8px)}}

/* ---------- Ô chọn có tìm kiếm ---------- */
.combo{position:relative}
.combo-list{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:330px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-pop);z-index:6;padding:4px}
.combo-opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer}
.combo-opt[aria-selected="true"],.combo-opt:hover{background:var(--brand-soft)}
.combo-opt .side{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.combo-empty{padding:12px;color:var(--muted)}
.tag-on{font-size:12px;font-weight:600;color:var(--paid);background:var(--paid-soft);border-radius:99px;padding:1px 8px;margin-left:6px}

/* ---------- Khung nhập đơn ---------- */
.ofrm .prev{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:11px 14px;border-radius:var(--r-s);background:var(--surface-2);border:1px solid var(--line);margin:12px 0 18px}
.ofrm .prev b{font-size:17px;font-variant-numeric:tabular-nums}
.ofrm .prev .small{flex-basis:100%}
.olines{display:grid;grid-template-columns:minmax(88px,1fr) minmax(84px,.9fr) minmax(104px,1fr) minmax(96px,1fr);gap:8px 10px;align-items:center}
.olines .h{font-size:12.5px;color:var(--muted);font-weight:600}
.olines .h.r{text-align:right}
.olines .pn{font-weight:600;display:flex;align-items:center;font-size:15px}
.olines output{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.olines .span3{grid-column:2/-1;margin-top:-4px}
.sumbox{margin-top:18px;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.sumbox>div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px;border-bottom:1px solid var(--line)}
.sumbox>div:last-child{border-bottom:0;background:var(--surface-2)}
.sumbox b{font-size:17px;font-variant-numeric:tabular-nums}
.sumbox .total b{font-size:25px;font-weight:800;letter-spacing:-.02em}
.sumbox .pos-debt{color:var(--debt)} .sumbox .neg{color:var(--paid)}

/* ---------- Bán lẻ ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s;min-height:150px}
.pcard:hover{border-color:var(--brand);background:var(--surface-2)}
.pcard .pname{font-weight:700;font-size:15.5px;line-height:1.3}
.pcard .stock{font-size:13px;color:var(--muted)}
.pcard .stock.out{color:var(--debt)}
.pcard .price{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pcard .price small{font-size:13px;font-weight:500;color:var(--muted)}
.pcard .acts{display:flex;gap:6px;margin-top:auto}
.pcard .acts .btn{flex:1}
.scanbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.scanbar .input{flex:1 1 220px}
.cart{position:sticky;top:88px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);display:flex;flex-direction:column;max-height:calc(100vh - 104px)}
.cart-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.cart-head b{font-size:16.5px}
.cart-items{overflow:auto;flex:1;min-height:110px}
.citem{display:grid;grid-template-columns:minmax(0,1fr) 78px 104px 36px;gap:6px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.citem .input{min-height:38px;padding:0 8px}
.citem .camt{grid-column:1/-1;text-align:right;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;margin-top:-2px}
.cart-empty{padding:28px 18px;color:var(--muted);text-align:center}
.cart-form{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.cart-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cart-change{font-weight:700;text-align:right;min-height:22px}
.cart-sum{padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
.cart-sum>div{display:flex;justify-content:space-between;align-items:baseline}
.cart-total{font-size:32px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--brand)}
.cart-acts{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.cart-acts .btn.primary{flex:1}
@media (max-width:1150px){.pos{grid-template-columns:1fr}.cart{position:static;max-height:none}}
.presets{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- Đăng nhập ---------- */
.login{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:var(--bg);overflow:auto}
.login-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-pop)}
.login-brand{padding:28px 24px 22px;text-align:center;background:#1D6A4D;color:#fff}
.login-brand img{width:84px;height:84px;border-radius:50%;background:#fff;border:3px solid #E2B24D;object-fit:contain}
.login-brand .lb-name{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:10px;color:#F6D27A}
.login-brand .lb-co{font-size:13px;opacity:.88;margin-top:2px}
.login-form{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.login-err{color:var(--debt);font-weight:600;background:var(--debt-soft);padding:10px 12px;border-radius:var(--r-s)}
.pw{position:relative}
.pw .btn{position:absolute;right:6px;top:50%;transform:translateY(-50%)}
.c{text-align:center}

/* ---------- Tờ hóa đơn (luôn nền trắng như giấy) ---------- */
.inv-controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 14px;padding:16px 18px;margin-bottom:16px}
.inv-controls .toggles{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px}
.paper-wrap{overflow:auto;padding:4px 0 24px}
.paper{position:relative;background:#fff;color:#141414;width:210mm;min-height:250mm;margin:0 auto;padding:12mm 13mm;box-shadow:0 2px 14px rgba(0,0,0,.14);font-family:"Be Vietnam Pro",Arial,sans-serif;font-size:13px;line-height:1.45;color-scheme:light}
.paper.a5{width:148mm;min-height:180mm;padding:8mm 9mm;font-size:11px}
.paper [contenteditable]{border-radius:3px}
.paper [contenteditable]:hover{background:#FFF6D5;outline:1px dashed #D4B45A}
.paper [contenteditable]:focus{background:#FFF1BF;outline:1px solid #C79A2A}
.paper .wm{position:absolute;left:50%;top:46%;width:56%;transform:translate(-50%,-50%);opacity:.06;pointer-events:none}
.paper .ph{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1D6A4D;padding-bottom:8px}
.paper .ph-left{display:flex;gap:10px;min-width:0}
.paper .ph img{width:64px;height:64px;border-radius:50%;object-fit:contain;border:2px solid #B8860B;flex:none}
.paper.a5 .ph img{width:46px;height:46px}
.paper .brandline{font-size:.8em;font-weight:700;color:#9A6A0E;letter-spacing:.02em}
.paper h1{font-size:1.16em;color:#14492F;margin:1px 0}
.paper .meta{font-size:.88em;color:#333}
.paper .ph-right{text-align:right;font-size:.88em;white-space:nowrap}
.paper .title{text-align:center;margin:12px 0 8px}
.paper .title h2{font-size:1.45em;color:#14492F}
.paper .title p{font-style:italic;color:#444}
.paper .buyer{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;padding:8px 10px;border:1px solid #CBD6CF;border-radius:6px;margin-bottom:8px}
.paper table.items{width:100%;border-collapse:collapse}
.paper .items th{background:#EEF4F0;border:1px solid #9FB3A6;padding:5px 6px;font-weight:700;color:#14492F;font-size:.95em}
.paper .items td{border:1px solid #B7C6BC;padding:2px 4px}
.paper .items tfoot td{background:#F7FAF8;font-weight:700;padding:4px 6px}
.paper .items tfoot tr.grand td{background:#E9F2EC;font-size:1.08em;color:#14492F}
.paper .items input{width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:2px 3px;border-radius:3px}
.paper .items input:hover{background:#FFF6D5} .paper .items input:focus{background:#FFF1BF;outline:1px solid #C79A2A}
.paper .r{text-align:right} .paper .cc{text-align:center}
.paper .items .x{border:0;background:none;color:#B0352B;cursor:pointer;font-weight:700;padding:2px 6px}
.paper .words{margin:7px 0;font-style:italic}
.paper .debtbox{border:1px solid #9FB3A6;border-radius:6px;margin:8px 0;overflow:hidden}
.paper .debtbox .dh{display:flex;justify-content:space-between;gap:8px;background:#EEF4F0;padding:5px 8px;font-weight:700;color:#14492F;font-size:.88em}
.paper .debtbox .dg{display:grid;grid-template-columns:repeat(5,1fr)}
.paper .debtbox .dg>div{padding:6px 8px;border-right:1px solid #CBD6CF}
.paper .debtbox .dg>div:last-child{border-right:0;background:#FBE8E5}
.paper .debtbox .dk{font-size:.8em;color:#555} .paper .debtbox .dv{font-weight:800;font-size:1.02em;white-space:nowrap}
.paper .debtbox .ds{font-size:.75em;color:#666}
.paper .bank{font-size:.88em;padding:6px 8px;border:1px dashed #B7C6BC;border-radius:6px;margin:6px 0}
.paper .sign{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:center;margin-top:12px}
.paper .sign .st{font-weight:800} .paper .sign .sn{font-style:italic;font-size:.85em;color:#555}
.paper .sign .space{height:80px}
.paper .stamp{display:block;height:116px;max-width:100%;object-fit:contain;margin:4px auto 0}
.paper .sign .name{font-weight:700}
.paper .foot{display:flex;justify-content:space-between;gap:12px;font-size:.8em;color:#555;border-top:1px solid #CBD6CF;margin-top:12px;padding-top:6px}
.paper .brk{break-before:page}
.paper .keep{break-inside:avoid}
.receipt{background:#fff;color:#141414;width:78mm;margin:0 auto;padding:5mm 4mm;font-size:12px;line-height:1.4;box-shadow:0 2px 14px rgba(0,0,0,.14);font-family:"Be Vietnam Pro",Arial,sans-serif;color-scheme:light}
.receipt.a5{width:148mm;padding:9mm;font-size:13px}
.receipt [contenteditable]:hover{background:#FFF6D5;outline:1px dashed #D4B45A}
.receipt [contenteditable]:focus{background:#FFF1BF;outline:1px solid #C79A2A}
.receipt .rc-head{text-align:center;border-bottom:1px dashed #888;padding-bottom:6px}
.receipt .rc-head img{width:44px;height:44px;border-radius:50%;object-fit:contain}
.receipt .rc-name{font-weight:800;font-size:1.05em}
.receipt .rc-title{text-align:center;font-weight:800;font-size:1.25em;margin:8px 0 4px}
.receipt .rc-meta>div{display:flex;justify-content:space-between;gap:8px}
.receipt table{width:100%;border-collapse:collapse;margin:8px 0}
.receipt th{border-bottom:1px solid #333;font-size:.9em;padding:3px 2px;text-align:left}
.receipt td{border-bottom:1px dotted #999;padding:2px}
.receipt td input{width:100%;border:0;background:transparent;font:inherit;color:inherit;padding:1px 2px}
.receipt td input:hover{background:#FFF6D5}
.receipt .r{text-align:right}
.receipt .x{border:0;background:none;color:#B0352B;cursor:pointer;font-weight:700}
.receipt .rc-sum>div{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.receipt .rc-grand{font-weight:800;font-size:1.25em;border-top:1px solid #333;margin-top:4px;padding-top:4px!important}
.receipt .rc-words{font-style:italic;font-size:.92em;margin-top:2px}
.receipt .rc-sign{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:12px;gap:10px}
.receipt .rc-sign .space{height:56px}
.receipt .rc-foot{text-align:center;margin-top:10px;border-top:1px dashed #888;padding-top:6px;font-style:italic}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;color:#141414}
.label-card{background:#fff;border:1.5px solid #222;border-radius:10px;padding:10px;break-inside:avoid;color-scheme:light}
.label-card .lh{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;color:#555;border-bottom:1px solid #ddd;padding-bottom:3px;margin-bottom:5px}
.label-card .ln{font-weight:800;font-size:14px;text-transform:uppercase}
.label-card .lp{font-weight:800;color:#B0352B}
.label-card .codes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.label-card .codes.one{grid-template-columns:1fr}
.label-card .code{text-align:center;border:1px solid #ddd;border-radius:6px;padding:4px}
.label-card .code small{display:block;font-size:10px;font-weight:700;color:#444}
.bc{width:100%;height:58px;display:block}
.label-sec{font-weight:700;margin:14px 0 8px}

/* ---------- In ấn ---------- */
#printHost{display:none}
.print-head{display:none}
@media print{
  :root{color-scheme:light;--bg:#fff;--surface:#fff;--surface-2:#F3F5F3;--surface-3:#EEF1EE;--ink:#111;--ink-2:#333;--muted:#555;--line:#C9CFCA;--line-strong:#9AA39C;--row-on:#fff;--brand-soft:#fff;--debt:#A3261C;--paid:#16653A;--brand:#1D6A4D}
  body.printing{background:#fff!important}
  body.printing>*:not(#printHost){display:none!important}
  body.printing #printHost{display:block!important}
  #printHost .paper,#printHost .receipt{box-shadow:none!important;margin:0 auto!important;min-height:0!important}
  #printHost .paper{width:auto!important;padding:0!important}
  #printHost .no-print,#printHost .actions,#printHost .toolbar,#printHost .below,#printHost .seg,#printHost .search,#printHost .plist,#printHost button{display:none!important}
  #printHost [contenteditable]{outline:none!important;background:none!important}
  #printHost .paper .items input,#printHost .receipt input{padding:0}
  #printHost .print-head{display:block!important;margin-bottom:10px;font-size:12px}
  #printHost .print-head h2{font-size:17px;margin:4px 0}
  #printHost .tbl-wrap{max-height:none!important;overflow:visible!important;border:0;border-radius:0}
  #printHost .split{display:block}
  #printHost .stats{border:1px solid #bbb;margin-bottom:8px}
  #printHost .stat .v{font-size:15px}
  #printHost .grid{font-size:10.5px}
  #printHost .grid th,#printHost .grid td{position:static!important;background:#fff!important;color:#111!important;border-color:#bbb!important;height:auto;padding:2px 4px;box-shadow:none!important}
  #printHost .grid .ci{border:0!important;background:none!important;height:auto;padding:0;font-size:10.5px;color:#111!important;min-width:0}
  #printHost .namebtn{max-width:none;padding:0;font-size:10.5px}
  #printHost .page-head h1{font-size:18px}
  #printHost .labels{grid-template-columns:repeat(2,1fr)}
}

/* ---------- Điện thoại: danh sách thẻ cho Sổ bán ra / Sổ nhập vào ---------- */
.mlist{display:flex;flex-direction:column}
.mitem{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:62px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:var(--ink)}
.mitem:hover{background:var(--surface-2)}
.mitem.on{background:var(--row-on);box-shadow:inset 3px 0 0 var(--brand)}
.mitem .mi-l{min-width:0}
.mitem .mi-l b{display:block;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ==========================================================================
   NÂNG CẤP v3.5 PRO — VERCEL CLOUD SYNC, MOBILE BOTTOM NAV, VIETQR, THEME
   ========================================================================== */
:root {
  --subtle: var(--surface-2);
  --hover: var(--surface-3);
  --line-2: var(--line-strong);
  --brand-line: var(--brand);
  --r-lg: var(--r-l);
}
body[data-theme="dark"] {
  --bg: #0E1512; --surface: #151F1A; --surface-2: #1A2620; --surface-3: #22302A;
  --subtle: #1A2620; --hover: #22302A;
  --ink: #E4ECE6; --ink-2: #C2CFC6; --muted: #8FA096;
  --line: #27362E; --line-strong: #3D5145; --line-2: #3D5145;
  --brand: #46A97F; --brand-hover: #58BC91; --brand-ink: #06120C; --brand-soft: #173329; --brand-line: #2F6B4C; --row-on: #17271E;
  --gold: #E2B24D; --gold-soft: #372C12;
  --debt: #F08C80; --debt-soft: #3A1E1A;
  --paid: #6FD49B; --paid-soft: #163223;
  --warn: #F3C35E; --warn-soft: #382D12;
  --ring: rgba(70,169,127,.38);
  --p-et: #46A97F; --p-en: #4CB7B7; --p-l: #E0A84A; --p-c: #B98BCB; --p-k: #93A398;
  color-scheme: dark;
}
body[data-theme="light"] {
  --bg: #EEF2EE; --surface: #FFFFFF; --surface-2: #F5F8F5; --surface-3: #E8EEE9;
  --subtle: #F5F8F5; --hover: #E8EEE9;
  --ink: #15231C; --ink-2: #3A4C42; --muted: #64746A;
  --line: #D9E2DA; --line-strong: #B4C3B8; --line-2: #B4C3B8;
  --brand: #1D6A4D; --brand-hover: #16573F; --brand-ink: #FFFFFF; --brand-soft: #E0EFE6; --brand-line: #8ad1c8; --row-on: #F0F7F2;
  color-scheme: light;
}
body[data-brand="teal"] { --brand: #0d7a6f; --brand-hover: #095e56; --brand-soft: #e3f5f3; --brand-line: #8ad1c8; }
body[data-brand="blue"] { --brand: #1b5ec9; --brand-hover: #1449a1; --brand-soft: #e6effd; --brand-line: #9abdf5; }
body[data-brand="amber"] { --brand: #b8620a; --brand-hover: #934d07; --brand-soft: #fdf0e1; --brand-line: #eab985; }
body[data-fsize="large"] { font-size: 16.5px; --ctl: 46px; --cell: 42px; }
body[data-fsize="xlarge"] { font-size: 18px; --ctl: 48px; --cell: 44px; }

/* Nút đồng bộ Vercel trên thanh trên cùng */
.cloudchip { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 12px; border-radius: 99px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); cursor: pointer; transition: .15s; white-space: nowrap; }
.cloudchip:hover { background: var(--surface-2); border-color: var(--line-strong); }
.cloudchip .cdot { width: 8px; height: 8px; border-radius: 99px; background: var(--muted); flex-shrink: 0; }
.cloudchip.ok { color: var(--brand); background: var(--brand-soft); border-color: var(--brand); }
.cloudchip.ok .cdot { background: var(--paid); box-shadow: 0 0 0 3px rgba(30,138,76,.18); }
.cloudchip.syncing .cdot { background: var(--brand); animation: cpulse 1s infinite; }
.cloudchip.pending { color: var(--warn); background: var(--warn-soft); border-color: var(--warn); }
.cloudchip.pending .cdot { background: var(--warn); }
.cloudchip.err { color: var(--debt); background: var(--debt-soft); border-color: var(--debt); }
.cloudchip.err .cdot { background: var(--debt); }
@keyframes cpulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: .55; } }

/* Thanh điều hướng dưới đáy cho điện thoại */
.bnav { display: none; }
@media (max-width: 760px) {
  .bnav {
    display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 28;
    height: calc(62px + env(safe-area-inset-bottom, 0px));
    padding: 4px 6px calc(4px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 18px rgba(0, 0, 0, .06);
  }
  .bnav a, .bnav button {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    height: 52px; border-radius: 10px; color: var(--muted); font-size: 11.5px; font-weight: 600;
    text-decoration: none; padding: 0 2px; border: 0; background: transparent; cursor: pointer;
  }
  .bnav a[aria-current="page"] { color: var(--brand); background: var(--brand-soft); }
  .bnav .bnav-fab {
    background: var(--brand); color: #fff; border-radius: 14px; height: 48px; margin: 0 4px;
    box-shadow: 0 4px 12px rgba(20, 108, 67, .28); font-weight: 700;
  }
  .bnav .bnav-fab:hover { background: var(--brand-hover); }
  .page { padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px)) !important; }
  .toasts { bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  .cloudchip .clbl-long { display: none; }
}

/* Thẻ đơn hàng di động nâng cấp */
.mlist { gap: 10px; padding: 10px; background: var(--bg); }
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; transition: border-color .12s; }
.mcard.on { border-left: 4px solid var(--brand); background: var(--row-on); }
.mcard-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; cursor: pointer; }
.mcard-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.mcard-tag { font-size: 12.5px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mcard-acts { display: flex; align-items: center; gap: 6px; padding-top: 6px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
.mcard-acts .btn.sm { min-height: 34px; padding: 0 10px; font-size: 13px; }

/* Nút bấm nhanh số lượng trong ngăn kéo & POS */
.qchips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 10px; }
.qchip { min-height: 34px; padding: 0 11px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line-strong); font-size: 13px; font-weight: 600; color: var(--ink-2); display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
.qchip:hover, .qchip:active { background: var(--brand-soft); color: var(--brand); border-color: var(--brand); }

/* Cải tiến ô chọn khách hàng (.combo) trên điện thoại */
.combo-wrap { position: relative; display: flex; align-items: center; }
.combo-wrap .input { padding-right: 40px; }
.combo-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; cursor: pointer; font-size: 18px; line-height: 1; }
.combo-clear:hover { background: var(--surface-3); color: var(--ink); }
.combo-list { max-height: 250px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; z-index: 25; }

/* Khung VietQR trên hóa đơn */
.qr-wrap { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 6px 0; padding: 8px 10px; border: 1px dashed #b9c2bc; border-radius: 6px; background: #fafcfa; }
.qr-wrap img { width: 108px; height: 108px; object-fit: contain; border: 1px solid #e1e6e2; border-radius: 6px; background: #fff; flex-shrink: 0; }
.rc-qr { text-align: center; margin: 8px 0 4px; padding-top: 6px; border-top: 1px dashed #888; }
.rc-qr img { width: 128px; height: 128px; object-fit: contain; margin: 4px auto; background: #fff; border-radius: 6px; }

async function resetPurchaseLedger() {

  const ok = await UI.confirm({ title: 'Làm trống toàn bộ sổ nhập vào?', message: 'Toàn bộ số liệu nhập của mọi ngày và danh sách NCC sẽ được làm mới (5 dòng trống). Hệ thống lưu mốc khôi phục trước.', ok: 'Làm trống', danger: true });

function addBlankSuppliers(n) { let max = W.suppliers.reduce((a, s) => Math.max(a, s.id), 0); for (let i = 0; i < n; i++) W.suppliers.push({ id: ++max, name: '', noCuCu: 0, noDauKy: 0, note: '' }); Store.commit(); refreshView(); toast(`Đã thêm ${n} dòng NCC trống.`); }
async function deleteParty(kind, id) {
  if (!requireOwner('xóa khỏi danh sách')) return;
  const L = LEDGER[kind]; const list = L.parties(); const idx = list.findIndex(p => p.id === id); if (idx < 0) return;
  const ok = await UI.confirm({ title: `Xóa ${L.word}?`, message: `Xóa <b>${esc(partyName(kind, id))}</b> cùng số liệu ở mọi ngày. Bạn có thể bấm "Hoàn tác" ngay sau đó.`, ok: 'Xóa', danger: true });
  if (!ok) return;
  const saved = {}; W.sheets.forEach(s => { const bag = L.bag(W.days[s]); if (bag[String(id)]) { saved[s] = bag[String(id)]; delete bag[String(id)]; } });
  Undo[kind].push({ party: clone(list[idx]), idx, saved }); list.splice(idx, 1);
  if (kind === 'purch') { Store.recalc(); W.sheets.forEach(syncNhapDay); }
  Store.commit(); refreshView(); toast(`Đã xóa ${partyName(kind, id) || 'dòng'} khỏi danh sách.`, { action: () => undoDelete(kind) });
}
function undoDelete(kind) {
  const it = Undo[kind].pop(); if (!it) return; const L = LEDGER[kind]; const list = L.parties();
  list.splice(Math.min(it.idx, list.length), 0, it.party);
  Object.keys(it.saved).forEach(s => { if (W.days[s]) L.bag(W.days[s])[String(it.party.id)] = it.saved[s]; });

  const d = UI.drawer({ title: `${kind === 'sales' ? 'Đơn bán' : 'Lô hàng nhập'} — ngày ${sheetLabel(s)}`, body, foot });
  const q = sel => d.el.querySelector(sel); const label = p => `${p.id} — ${p.name || '(chưa đặt tên)'}`;
  const vals = () => {

    if (st.id != null) {
      const curP = findParty(kind, st.id);
      if (curP) {
        const cleaned = raw.replace(new RegExp(`^${curP.id}\s*[—–-]\s*`), '').trim();
        if (cleaned && cleaned !== '(chưa đặt tên)' && !curP.name) {
          curP.name = cleaned; if (kind === 'sales') curP.rawName = cleaned;
        }
        return st.id;
      }
    }
    if (!raw) return null;
    const mPrefix = /^(\d+)\s*[—–-]\s*(.*)$/.exec(raw);
    if (mPrefix) {
      const pid = Number(mPrefix[1]); const p = findParty(kind, pid);
      if (p) {
        const nm = mPrefix[2].trim();
        if (nm && nm !== '(chưa đặt tên)' && !p.name) { p.name = nm; if (kind === 'sales') p.rawName = nm; }
        load(pid, true); return pid;

    if (/^\d+$/.test(raw)) {
      const pid = Number(raw); const p = findParty(kind, pid);
      if (p) { load(pid, true); return pid; }
    }
    const qNorm = norm(raw.replace(/[—–-]/g, ' '));
    const exact = parties.find(p => norm(p.name) === qNorm || norm(`${p.id} ${p.name}`) === qNorm);
    if (exact) { load(exact.id, true); return exact.id; }
    const partial = parties.filter(p => norm(`${p.id} ${p.name} ${p.note || ''}`).includes(qNorm));
    if (partial.length === 1) { load(partial[0].id, true); return partial[0].id; }

      if (emptySlot) {
        emptySlot.name = raw;
        if (q('#oNote').value.trim()) emptySlot.note = q('#oNote').value.trim();
        Store.commit(); st.id = emptySlot.id; return emptySlot.id;

      const target = { id: newId, name: raw, note: q('#oNote').value.trim(), noCuCu: 0, noDauKy: 0 };
      if (kind === 'sales') target.rawName = raw;

  setupCombo(q('.combo'), {

      }
      list.sort((a, b) => (qq && (String(a.p.id) === qq) !== (String(b.p.id) === qq) ? (String(a.p.id) === qq ? -1 : 1) : a.i - b.i));

    if (e.key === 'Enter' && e.target.matches('.drawer-body [data-o]')) { e.preventDefault(); const all = $$('.drawer-body [data-o]', d.el); const i = all.indexOf(e.target); if (i >= 0 && i < all.length - 1) { all[i + 1].focus(); all[i + 1].select(); } else q('#oSave').focus(); }
  });
  let activeSL = q('[data-o="etSL"]');
  d.el.addEventListener('focusin', e => { if (e.target.matches && /^(et|en|l|c)SL$/.test(e.target.dataset.o || '')) activeSL = e.target; });
  $$('[data-qstep]', d.el).forEach(btn => {
    btn.addEventListener('pointerdown', e => e.preventDefault());
    btn.onclick = () => {
      const target = activeSL || q('[data-o="etSL"]'); if (!target) return;
      const cur = parseQty(target.value); const next = round2(cur + Number(btn.dataset.qstep));
      target.value = fmtQtyIn(next);

  q('#oCopyLast').onclick = () => {

    const idx = W.sheets.indexOf(s);

      const sh = W.sheets[i]; const bag = L.bag(W.days[sh] || {}); const e = bag && bag[String(pid)];
      if (e && PRODS.some(p => num(e[p.k + 'SL']) > 0)) { foundDay = sh; foundEntry = e; break; }
    }
    if (!foundEntry) { toast(`Chưa tìm thấy ${L.unit} cũ của ${partyName(kind, pid)} ở các ngày trước.`, { type: 'err' }); return; }

  };

  if (id != null) { load(id, false); setTimeout(() => { const f = q('[data-o="etSL"]'); if (f) { f.focus(); f.select(); } }, 50); }
  else { calc(); if (!isNarrow()) setTimeout(() => { const f = q('#oParty'); if (f) f.focus(); }, 50); }
}

n sm ghost" type="button" data-act="delProduct" data-id="${r.id}" title="${owner ? 'Xóa mặt hàng' : 'Chỉ chủ cửa hàng được xóa'}" aria-label="Xóa mặt hàng" ${owner ? '' : 'disabled'}>${icon('trash')}</button></div></td></tr>`;
  }).join('');
  return `${retailBanner(st)}<div class="page-head"><div><h1>Hàng, giá &amp; tồn quầy</h1><p class="sub">Ngày ${esc(isoToVN(S.rDate))}. Tồn đầu tự lấy từ tồn cuối ngày trước; giá sửa ở đây áp dụng ngay cho quầy.</p></div><div class="actions"><button class="btn" data-act="carryStock">${icon('swap')}Lấy tồn cuối ngày trước</button><button class="btn" data-act="convModal">${icon('box')}Quy đổi kg ↔ khay</button><button class="btn" data-act="barcodeModal">${icon('barcode')}In mã vạch</button><button class="btn icon" data-act="exportRetail" title="Xuất Excel ngày này" aria-label="Xuất Excel">${icon('download')}</button><button class="btn primary" data-act="addProduct">${icon('plus')}Thêm mặt hàng</button></div></div>

OnChange.stock = (t, ev) => {
  const el = ev.target; const pid = Number(el.dataset.pid); const f = el.dataset.f; if (!pid || !f) return;
  const p = R.products.find(x => x.id === pid); const rec = rDayRec(); const it = rec.items[String(pid)]; if (!p || !it) return;
  if (f === 'name' || f === 'unit') { p[f] = el.value.trim() || (f === 'unit' ? 'Kg' : p.name); }
  else if (f === 'subUnit') { it.subUnit = el.value.trim() || 'Khay'; p.subUnit = it.subUnit; }
  else if (f === 'importSubQty') { it.importSubQty = parseQty(el.value); if (num(it.importKg) > 0 && it.importSubQty > 0) { it.subPerKg = it.importSubQty / num(it.importKg); p.subPerKg = round2(it.subPerKg); } }
  else if (f === 'soldTotal') { const posKg = retailDayStats(S.rDate).productMap[pid].posKg; const total = parseQty(el.value); it.soldKgManual = Math.max(0, round2(total - posKg)); if (total < posKg) toast(`Đã bán qua quầy ${fmtQty(posKg)} ${p.unit}, không thể nhỏ hơn số này.`, { type: 'err' }); }
  else if (f === 'importPrice' || f === 'sellPrice') { it[f] = parseMoney(el.value); it.priceConfirmed = true; if (f === 'importPrice') p.defaultImportPrice = it[f]; else p.defaultSellPrice = it[f]; if (!Object.values(rec.items).some(x => x.priceConfirmed === false)) rec.priceFromYesterdayWarning = false; }
  else { it[f] = parseQty(el.value); if (f === 'importKg' && num(it.importSubQty) > 0 && it[f] > 0) it.subPerKg = num(it.importSubQty) / it[f]; }
  Store.saveR(); keepFocus(refreshView);
};
Act.addProduct = () => {
  const id = R.products.reduce((a, p) => Math.max(a, p.id), 0) + 1;
  R.products.push({ id, name: 'Mặt hàng mới', unit: 'Kg', subUnit: 'Khay', subPerKg: 0, defaultImportPrice: 0, defaultSellPrice: 0 });

  setTimeout(() => { const n = document.querySelector(`[data-fk="st:${id}:name"]`); if (n) { n.focus(); n.select(); n.scrollIntoView({ block: 'center' }); } }, 30);
};
Act.delProduct = async el => {

  const p = R.products[idx]; const ok = await UI.confirm({ title: 'Xóa mặt hàng?', message: `Xóa <b>${esc(p.name)}</b> khỏi danh sách bán lẻ. Các đơn đã bán vẫn được giữ.`, ok: 'Xóa', danger: true }); if (!ok) return;
  const items = {}; Object.keys(R.days).forEach(d => { const it = R.days[d].items && R.days[d].items[String(id)]; if (it) { items[d] = it; delete R.days[d].items[String(id)]; } });
  Undo.prod.push({ p: clone(p), idx, items }); R.products.splice(idx, 1); Store.saveR(); refreshView(); toast(`Đã xóa ${p.name}.`, { action: () => Act.undoProduct() });
};
Act.undoProduct = () => { const u = Undo.prod.pop(); if (!u) return; R.products.splice(Math.min(u.idx, R.products.length), 0, u.p); Object.keys(u.items).forEach(d => { if (R.days[d]) R.days[d].items[String(u.p.id)] = u.items[d]; }); Store.saveR(); refreshView(); toast(`Đã khôi phục ${u.p.name}.`); };
Act.carryStock = async () => {

OnChange.expense = (t, ev) => { const el = ev.target; const e = rDayRec().expenses.find(x => String(x.id) === el.dataset.eid); if (!e || !el.dataset.f) return; e[el.dataset.f] = el.dataset.f === 'amount' ? parseMoney(el.value) : el.value; e.confirmedToday = true; Store.saveR(); keepFocus(refreshView); };

Act.copyExpenses = async () => {

const xQ = v => (typeof v === 'number' ? v : parseQty(v)), xM = v => (typeof v === 'number' ? v : parseMoney(v));
/** Đọc 1 sheet theo đúng bố cục file Excel gốc (cột 0 STT, 1 tên, 2–11 SL/giá/khay, 13 trả, 15 nợ cũ cũ, 16 nợ hôm trước, 18 ghi chú, 20–24 nhập xuất tồn). */
function parseSheetAOA(aoa, isFirst, map) {
  const entries = {}; const nxt = emptyNxt();
  aoa.forEach(row => {
    if (!row || row.length < 2) return;
    const lab = norm(row[20]);
    const k = lab.includes('ech to') ? 'echTo' : lab.includes('ech nho') ? 'echNho' : lab.includes('luon') ? 'luon' : lab.includes('chach') ? 'chach' : null;
    if (k) nxt[k] = { nhap: xQ(row[21]), xuat: xQ(row[22]), chet: xQ(row[24]) };
    const stt = parseInt(row[0], 10); const name = String(row[1] || '').trim(); if (isNaN(stt) || stt <= 0 || !name) return;
    const has = v => v !== undefined && v !== null && v !== '';
    if (!map.has(stt)) map.set(stt, { id: stt, name, rawName: String(row[1] || ''), noCuCu: xM(row[15]), noDauKy: xM(row[16]), note: has(row[18]) ? String(row[18]).trim() : '' });
    else if (isFirst) { const c = map.get(stt); if (has(row[15])) c.noCuCu = xM(row[15]); if (has(row[16])) c.noDauKy = xM(row[16]); if (has(row[18])) c.note = String(row[18]).trim(); }
    const e = { etSL: xQ(row[2]), etDG: xM(row[3]), enSL: xQ(row[4]), enDG: xM(row[5]), lSL: xQ(row[6]), lDG: xM(row[7]), cSL: xQ(row[8]), cDG: xM(row[9]), khayThua: xQ(row[10]), khayThieu: xQ(row[11]), tra: xM(row[13]) };
    if (Object.values(e).some(v => v)) entries[String(stt)] = e;
  });
  return { entries, nxt };
}
async function importExcelFile(file) {
  if (!requireOwner('nhập dữ liệu từ Excel')) return;
  await withXLSX(async X => {
    const wb = X.read(new Uint8Array(await file.arrayBuffer()), { type: 'array' });
    const map = new Map(), parsed = {}, sheets = [];
    wb.SheetNames.forEach((name, i) => { const key = String(name).trim(); if (!key || sheets.includes(key)) return; parsed[key] = parseSheetAOA(X.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' }), i === 0, map); sheets.push(key); });
    const customers = Array.from(map.values()).sort((a, b) => a.id - b.id);
    if (!customers.length) { toast('Không tìm thấy danh sách khách hàng (cột STT và tên) trong file.', { type: 'err', ms: 6000 }); return; }
    const ok = await UI.confirm({ title: 'Nhập sổ bán ra từ Excel?', message: `File <b>${esc(file.name)}</b> có ${sheets.length} ngày và ${customers.length} khách hàng. Sổ bán ra hiện tại sẽ được thay; sổ nhập vào, nhà cung cấp, tài khoản và cài đặt được giữ nguyên. Hệ thống lưu mốc khôi phục trước.`, ok: 'Nhập dữ liệu', danger: true });
    if (!ok) return; snapshot('Trước khi nhập file Excel ' + file.name);
    const old = W; const next = { trayPrice: old.trayPrice || 35000, company: old.company, users: old.users, uiConfig: old.uiConfig, sheets, customers, days: {}, suppliers: old.suppliers, dailyCustomCols: old.dailyCustomCols, purchaseCustomCols: old.purchaseCustomCols, _v7CleanPurchaseInit: true };
    sheets.forEach(s => { const od = old.days[s] || {}; next.days[s] = { entries: parsed[s].entries, nxt: parsed[s].nxt, purchases: od.purchases || {} }; if (od.dailyPrices) next.days[s].dailyPrices = od.dailyPrices; if (od.dailyPurchasePrices) next.days[s].dailyPurchasePrices = od.dailyPurchasePrices; });
    Store.w = normalizeWholesale(next); Prefs.set('welcomeDone', true); S.firstRun = false;

}

/* ---------- Sự kiện chung ---------- */
function onKey(ev) {
  const t = ev.target; const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (ev.key === 'Escape') { if (UI._menu) { UI.closeMenu(); return; } if (UI.closeTop()) { ev.preventDefault(); return; } document.body.classList.remove('nav-open'); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); if (Auth.user) Act.saveNow(); return; }
  if (!Auth.user) return;
  if (ev.key === 'Enter' && t.id === 'scanInput') { ev.preventDefault(); scanCode(t.value); t.value = ''; return; }
  if (ev.key === 'Enter' && t.matches && t.matches('input.ci') && !ev.isComposing) {
    ev.preventDefault(); const tr = t.closest('tr'); const f = t.dataset.f; if (!tr || !f) { t.blur(); return; }
    const sel = `[data-f="${CSS.escape(f)}"]`; let n = ev.shiftKey ? tr.previousElementSibling : tr.nextElementSibling;
    while (n && !n.querySelector(sel)) n = ev.shiftKey ? n.previousElementSibling : n.nextElementSibling;
    const target = n && n.querySelector(sel); if (target) target.focus(); else t.blur();
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && t.matches && t.matches('[role="button"][data-act]')) { ev.preventDefault(); t.click(); return; }
  if (typing || UI.stack.length || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if (ev.key === '/') { const s = $('#page .search input'); if (s) { ev.preventDefault(); s.focus(); } }
  else if ((ev.key === 'n' || ev.key === 'N') && (S.route === 'ban-ra' || S.route === 'nhap-vao')) { ev.preventDefault(); openOrderDrawer(S.route === 'ban-ra' ? 'sales' : 'purch', null); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') { const ctx = ROUTES[S.route] && ROUTES[S.route].ctx; if (ctx === 'day' || ctx === 'rdate') { const b = $(`#tbCtx .arrow[data-d="${ev.key === 'ArrowLeft' ? -1 : 1}"]`); if (b && !b.disabled) { ev.preventDefault(); b.click(); } } }
}
function bindEvents() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return; const fn = Act[el.dataset.act]; if (!fn) return;
    if (el.tagName !== 'INPUT' && el.tagName !== 'SELECT') ev.preventDefault();
    fn(el, ev);
  });
  document.addEventListener('change', ev => { const h = ev.target.closest && ev.target.closest('[data-change]'); if (h && OnChange[h.dataset.change]) OnChange[h.dataset.change](h, ev); });
  document.addEventListener('input', ev => { const el = ev.target; if (el.classList && el.classList.contains('money')) liveMoney(el); const h = el.closest && el.closest('[data-input]'); if (h && OnInput[h.dataset.input]) OnInput[h.dataset.input](el, ev); });
  document.addEventListener('focusin', ev => { const t = ev.target; if (t && t.matches && t.matches('input.ci, .olines input, .citem input, .paper .items input, #rcLines input') && t.value) { try { t.select(); } catch (e) { /* bỏ qua */ } } });
  document.addEventListener('mousedown', ev => { if (UI._menu && !UI._menu.contains(ev.target) && !(UI._menuAnchor && UI._menuAnchor.contains(ev.target))) UI.closeMenu(); });
  document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
  document.addEventListener('pointerup', () => { setTimeout(() => { pointerDown = false; }, 0); }, true);
  document.addEventListener('pointercancel', () => { pointerDown = false; }, true);
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', route);
  let narrow = isNarrow(); window.addEventListener('resize', () => { const n = isNarrow(); if (n !== narrow) { narrow = n; if (S.route === 'ban-ra' || S.route === 'nhap-vao') refreshView(); } UI.closeMenu(); });
  window.addEventListener('storage', e => { if (e.key === KEYS.wholesale || e.key === KEYS.retail) toast('Dữ liệu vừa được thay đổi ở một cửa sổ khác. Hãy tải lại trang (F5) để xem bản mới nhất.', { type: 'err', ms: 8000 }); });
}

   [8] MÔ-ĐUN NÂNG CẤP v3.5 PRO:
       - ĐỒNG BỘ ĐÁM MÂY VERCEL 2 CHIỀU (CloudSync) + HÀNG ĐỢI NGOẠI TUYẾN

const VIETQR_BANKS = [
  ['', '— Chọn ngân hàng nhận QR —'],
  ['VCB', 'Vietcombank (VCB)'],
  ['ICB', 'VietinBank (ICB)'],
  ['BIDV', 'BIDV'],

];

function vietQRSvgFallback(bank, acc, amount, info) {
  const txt = `${bank}:${acc}|${amount}|${info}`;
  let h = 2166136261;
  for (let i = 0; i < txt.length; i++) h = Math.imul(h ^ txt.charCodeAt(i), 16777619);
  const cells = [];
  const n = 21;
  const isFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < n; c++) {
      let on = false;
      if (isFinder(r, c)) {
        const rr = r < 7 ? r : r - (n - 7);
        const cc = c < 7 ? c : c - (n - 7);
        on = rr === 0 || rr === 6 || cc === 0 || cc === 6 || (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4);
      } else {
        h = Math.imul(h ^ ((r * 31 + c * 17) & 0xff), 16777619);
        on = ((h >>> 3) & 1) === 1;
      }
      if (on) cells.push(`<rect x="${c + 2}" y="${r + 2}" width="1" height="1" fill="#162019"/>`);
    }
  }
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 25" shape-rendering="crispEdges"><rect width="25" height="25" fill="#fff"/>${cells.join('')}</svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}

function vietQRInvoiceHTML(v, r, party) {
  const c = W.company || {};
  const bank = String(c.qrBank || '').trim();
  const acc = String(c.qrAccount || '').replace(/\s+/g, '');
  if (!bank || !acc) return '';
  const holder = String(c.qrHolder || c.director || '').trim();
  const mode = c.qrMode || 'remain';
  const t = invTotals(v);
  const paid = num(r && r.tra);
  const remain = Math.max(0, t.grand - paid);
  const prev = num(r && r.noCuCu) + num(r && r.noHomTrc);
  const totalDebt = Math.max(0, prev + (t.grand - paid));
  const amount = mode === 'today' ? Math.round(t.grand) : mode === 'total_debt' ? Math.round(totalDebt) : mode === 'zero' ? 0 : Math.round(remain);
  const info = `EHH ${party && party.name ? party.name : ('KH' + v.id)} TT ngay ${v.day}`;
  const url = `https://img.vietqr.io/image/${encodeURIComponent(bank)}-${encodeURIComponent(acc)}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(info)}&accountName=${encodeURIComponent(holder)}`;
  const fb = vietQRSvgFallback(bank, acc, amount, info);
  return `<div style="text-align:center;font-size:11px;line-height:1.25"><img src="${url}" alt="VietQR" onerror="this.onerror=null;this.src='${fb}'"><div><b>Quét VietQR</b>${amount > 0 ? `<br>${fmtMoney(amount)} đ` : ''}</div></div>`;
}

function vietQRRetailHTML(t, order) {

/* ---------- Xuất phiếu báo đơn & công nợ qua Zalo / SMS ---------- */
function buildZaloSlipText(kind, id, day) {
  const L = LEDGER[kind]; const comp = L.calc(day); if (!comp || !comp.rows[id]) return '';
  const r = comp.rows[id]; const p = findParty(kind, id) || {};
  const lines = [];
  lines.push(`🐸 ẾCH HOÀNG HẬU — PHIẾU BÁO ${kind === 'sales' ? 'ĐƠN HÀNG & CÔNG NỢ' : 'NHẬP HÀNG'}`);
  lines.push(`📅 Ngày: ${sheetLabel(day)}`);
  lines.push(`👤 ${L.Word}: ${r.displayName || p.name || ('#' + id)}`);
  lines.push(`------------------------`);
  let hasItem = false;
  PRODS.forEach(pr => {
    const sl = num(r[pr.k + 'SL']), dg = num(r[pr.k + 'DG']), amt = sl * dg;
    if (sl > 0) { hasItem = true; lines.push(`• ${pr.name}: ${fmtQty(sl)} kg × ${fmtMoney(dg)} = ${fmtMoney(amt)} đ`); }
  });
  if (kind === 'sales' && (r.khayThua || r.khayThieu)) {
    const tray = num(W.trayPrice) || 35000;
    const tienKhay = (num(r.khayThieu) - num(r.khayThua)) * tray;
    lines.push(`• Khay: ${r.khayThieu ? 'Thiếu +' + fmtQty(r.khayThieu) : ''} ${r.khayThua ? 'Thừa −' + fmtQty(r.khayThua) : ''} (${fmtMoney(tienKhay)} đ, giá ${fmtMoney(tray)}đ/khay)`);
  }
  if (!hasItem) lines.push(`• (Không phát sinh hàng trong ngày)`);
  lines.push(`------------------------`);
  lines.push(`💰 Tiền hàng hôm nay: ${fmtMoney(r.thanhTien)} đ`);
  lines.push(`✅ Đã thanh toán: ${fmtMoney(r.tra)} đ`);
  lines.push(`📌 Còn nợ hôm nay: ${fmtMoney(r.noNgay)} đ`);
  const prev = num(r.noCuCu) + num(r.noHomTrc);
  if (prev !== 0) lines.push(`📂 Nợ cũ chuyển sang: ${fmtMoney(prev)} đ`);
  lines.push(`👉 TỔNG DƯ NỢ ĐẾN HẾT ${sheetLabel(day)}: ${fmtMoney(r.tongNo)} đ`);
  const bk = co('bank');
  if (bk) { lines.push(`------------------------`); lines.push(`🏦 ${bk}`); }
  return lines.join('\n');
}

/* ---------- ĐỒNG BỘ ĐÁM MÂY VERCEL (CloudSync) ---------- */
const CloudSync = {
  status: 'off', // 'off' | 'ok' | 'syncing' | 'pending' | 'err'
  msg: 'Chưa kết nối Vercel',
  timer: null,
  pushTimer: null,
  busy: false,
  cfg() {
    const def = { url: '', secret: '', autoSync: true, intervalSec: 25, lastSync: '', lastUpdatedAt: 0, pendingSync: false };
    return Object.assign(def, Storage.get(KEYS.cloud) || {});
  },
  saveCfg(patch) {
    const next = Object.assign(this.cfg(), patch);
    try { Storage.set(KEYS.cloud, next); } catch (e) { /* bỏ qua */ }
    return next;
  },
  normalizeUrl(raw) {
    let u = String(raw || '').trim();
    if (!u) return '';
    if (u.startsWith('/')) return u;
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    try {
      const parsed = new URL(u);
      if (!parsed.pathname || parsed.pathname === '/') parsed.pathname = '/api/sync';
      return parsed.toString();
    } catch (e) {
      return u;
    }
  },
  init() {
    // 1. Kiểm tra link cài đặt nhanh từ mã QR (?cloud_url=...&cloud_key=...)
    try {
      const sp = new URLSearchParams(location.search || (location.hash.includes('?') ? location.hash.split('?')[1] : ''));
      const qUrl = sp.get('cloud_url');
      const qKey = sp.get('cloud_key');
      if (qUrl) {
        this.saveCfg({ url: this.normalizeUrl(qUrl), secret: qKey || this.cfg().secret, autoSync: true });
        history.replaceState(null, '', location.pathname + (location.hash ? location.hash.split('?')[0] : ''));
        setTimeout(() => toast('Đã tự động kết nối Link đồng bộ Vercel từ mã QR!'), 400);
      }
    } catch (e) { /* bỏ qua */ }

    const cur = this.cfg();
    if (cur.url) {
      this.status = cur.pendingSync ? 'pending' : 'ok';
      this.msg = cur.lastSync ? `Đồng bộ ${cur.lastSync}` : 'Đã cấu hình Vercel';
      if (cur.autoSync) {
        setTimeout(() => { if (this.cfg().pendingSync) this.pushNow(true); else this.pullNow(true); }, 1500);
      }
      this.startLoop();
    } else if (/^https?:$/i.test(location.protocol) && location.hostname.endsWith('.vercel.app')) {
      // Thử kiểm tra xem /api/sync có hoạt động trên tên miền .vercel.app này không
      fetch(location.origin + '/api/sync', { method: 'GET', cache: 'no-store' })
        .then(r => r.ok ? r.json() : null)
        .then(j => {
          if (j && j.ok) {
            this.saveCfg({ url: location.origin + '/api/sync', autoSync: true });
            this.setStatus('ok', 'Tự động kết nối');
            this.startLoop();
            this.pullNow(true);
          }
        })
        .catch(() => { /* bản tĩnh chưa gắn api/sync.js */ });
    }

    window.addEventListener('online', () => {
      if (this.cfg().url && this.cfg().pendingSync) {
        toast('Đã có mạng trở lại — đang tự động đẩy dữ liệu lên Vercel...');
        this.pushNow(true);
      }
    });
  },
  startLoop() {
    if (this.timer) clearInterval(this.timer);
    const c = this.cfg();
    if (!c.url || !c.autoSync) return;
    const ms = Math.max(12, Number(c.intervalSec) || 25) * 1000;
    this.timer = setInterval(() => {
      if (document.hidden || this.busy || UI.stack.length) return;
      const a = document.activeElement;
      if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
      if (this.cfg().pendingSync) this.pushNow(true);
      else this.pullNow(true);
    }, ms);
  },
  setStatus(st, m) {
    this.status = st; if (m) this.msg = m;
    const chip = document.getElementById('cloudChip');
    if (chip) {
      chip.className = 'cloudchip ' + st;
      chip.innerHTML = `<span class="cdot"></span><span>☁️ Vercel</span><span class="clbl-long">: ${esc(this.msg)}</span>`;
    }
  },
  schedulePush() {
    const c = this.cfg();
    const now = Date.now();
    this.saveCfg({ lastUpdatedAt: now, pendingSync: !!c.url });
    if (!c.url || !c.autoSync) return;
    this.setStatus('pending', 'Chờ đồng bộ...');
    if (this.pushTimer) clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.pushNow(true), 1200);
  },
  headers() {
    const c = this.cfg();
    const h = { 'Content-Type': 'application/json' };
    if (c.secret) h['x-sync-secret'] = c.secret;
    return h;
  },
  async pushNow(silent = false) {
    const c = this.cfg();
    const url = this.normalizeUrl(c.url);
    if (!url) { if (!silent) toast('Hãy nhập Link Vercel trước.', { type: 'err' }); return false; }
    if (this.busy) return false;
    this.busy = true;
    this.setStatus('syncing', 'Đang đẩy lên...');
    try {
      const ts = Date.now();
      const payload = {
        app: 'ech-hoang-hau-v3',
        version: APP_VERSION,
        updatedAt: ts,
        updatedBy: Auth.user ? Auth.user.username : 'system',
        wholesaleAppData: Store.w,
        retailAppData: Store.r
      };
      const res = await fetch(url, { method: 'POST', headers: this.headers(), body: JSON.stringify(payload) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const tStr = hhmm(new Date());
      this.saveCfg({ url, lastSync: tStr, lastUpdatedAt: ts, pendingSync: false });
      this.setStatus('ok', 'Đã đồng bộ ' + tStr);
      if (!silent) toast('Đã đẩy toàn bộ dữ liệu Sỉ & Lẻ lên đám mây Vercel thành công!');
      if (!UI.stack.length && (S.route === 'du-lieu' || S.route === 'cai-dat')) refreshView();
      return true;
    } catch (e) {
      this.saveCfg({ pendingSync: true });
      this.setStatus('err', 'Chờ gửi khi có mạng');
      if (!silent) toast('Chưa đẩy lên được Vercel (' + e.message + '). Dữ liệu đã lưu an toàn trong máy và sẽ tự gửi khi có mạng.', { type: 'err', ms: 6000 });
      return false;
    } finally {
      this.busy = false;
    }
  },
  async pullNow(silent = false, forceOverwrite = false) {
    const c = this.cfg();
    const url = this.normalizeUrl(c.url);
    if (!url) { if (!silent) toast('Hãy nhập Link Vercel trước.', { type: 'err' }); return false; }
    if (this.busy) return false;
    if (silent && (c.pendingSync || UI.stack.length)) return false;
    this.busy = true;
    this.setStatus('syncing', 'Đang kiểm tra...');
    try {
      const res = await fetch(url, { method: 'GET', headers: this.headers(), cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const body = await res.json();
      const d = (body && body.data) ? body.data : body;
      const remoteTs = Number((d && d.updatedAt) || (body && body.updatedAt) || 0);
      const localTs = Number(c.lastUpdatedAt || 0);
      const w = d && (d.wholesaleAppData || (Array.isArray(d.sheets) ? d : null));
      const r = d && (d.retailAppData || null);
      if (w && Array.isArray(w.sheets)) {
        if (forceOverwrite || (remoteTs > localTs + 1500 && !c.pendingSync) || (!localTs && !c.pendingSync)) {
          Store.w = normalizeWholesale(w);
          if (r && Array.isArray(r.products)) Store.r = normalizeRetail(r);
          syncUsers(); Store.recalc(); Store.saveW(true); Store.saveR(true);
          if (!W.sheets.includes(S.day)) S.day = pickInitialDay();
          if (!UI.stack.length) refreshView();
          if (!silent) toast('Đã tải dữ liệu mới nhất từ đám mây Vercel về máy!');
        } else if (!silent) {
          toast('Đã kết nối Vercel! Dữ liệu trên máy đang là bản mới nhất.');
        }
      } else if (!silent) {
        toast('Kết nối Vercel thành công! Đang đẩy dữ liệu khởi tạo từ máy lên Vercel...');
        this.busy = false;
        return await this.pushNow(false);
      }
      const tStr = hhmm(new Date());
      this.saveCfg({ url, lastSync: tStr, lastUpdatedAt: Math.max(localTs, remoteTs || Date.now()), pendingSync: false });
      this.setStatus('ok', 'Đã đồng bộ ' + tStr);
      return true;
    } catch (e) {
      this.setStatus('err', 'Không kết nối được');
      if (!silent) toast('Không tải được từ Link Vercel (' + e.message + '). Hãy kiểm tra lại đường dẫn https://...vercel.app/api/sync.', { type: 'err', ms: 6000 });
      return false;
    } finally {
      this.busy = false;
    }
  }
};
